const el=id=>document.getElementById(id),money=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});let items=[],photoURL,limits=new Map();
async function load(){try{let r=await fetch('https://aabhushan-sales-catalogue.jigar-rock13.chatgpt.site/api/items');if(!r.ok)throw Error();items=await r.json();render();updateOrder()}catch{el('status').textContent='Could not load the catalogue. Refresh to retry.'}}
function draw(img,w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
const blob=c=>new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('Photo conversion failed.')),'image/jpeg',.92));
function productGallery(card,item,base){
 const cover=card.querySelector('img');
 const main=cover.src;
 async function loadPhotos(){
  const response=await fetch(base+'/product-details/'+encodeURIComponent(item.code));
  if(!response.ok)throw Error();
  const d=await response.json();
  const ai=d.photos.find(p=>p.kind==='Ai photo');
  const regular=d.photos.find(p=>p.kind==='Regular photo');
  const first=d.coverType==='Ai photo'||!ai?main:base+ai.url;
  const second=regular?base+regular.url:first!==main?main:null;
  cover.src=first;
  if(second){
   const frame=document.createElement('div');frame.className='photo-strip';
   cover.replaceWith(frame);frame.append(cover);
   const next=new Image();next.loading='lazy';next.crossOrigin='anonymous';next.src=second;next.alt='Regular photo of '+item.code;frame.append(next);
   const toggle=document.createElement('button');toggle.type='button';toggle.className='photo-switch';
   const label=()=>{toggle.textContent=frame.scrollLeft>frame.clientWidth/2?'2 / 2 · Regular photo ‹':'1 / 2 · '+(d.coverType==='Ai photo'||ai?'AI photo':'Cover photo')+' ›'};
   label();toggle.onclick=()=>frame.scrollTo({left:frame.scrollLeft>frame.clientWidth/2?0:frame.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});frame.onscroll=label;frame.after(toggle);
  }
  if(d.description){const detail=document.createElement('details'),title=document.createElement('summary'),body=document.createElement('p');title.textContent='Description';body.style.whiteSpace='pre-wrap';body.textContent=d.description;detail.append(title,body);card.append(detail)}
 }
 const start=()=>loadPhotos().catch(()=>{const retry=document.createElement('button');retry.textContent='Reload photos';retry.onclick=()=>{retry.remove();start()};card.append(retry)});
 if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){observer.disconnect();start()}},{rootMargin:'200px'});observer.observe(card)}else start();
}
function showCharacteristics(card,item){
 const values=Object.values(item.characteristics||{});
 if(!values.length)return;
 const details=document.createElement('details');
 const title=document.createElement('summary');
 title.textContent='Product details';
 details.append(title);
 for(const [label,value] of Object.entries(item.characteristics)){
  const row=document.createElement('p');row.textContent=label+' · '+(item.category==='Pendant Sets'&&value==='Non-AD'?'Regular pendant':item.category==='Pendant Sets'&&value==='AD'?'Ad pendant':value.charAt(0).toUpperCase()+value.slice(1).toLowerCase());details.append(row);
 }
 card.append(details);
}
function designCard(i){
let a=document.createElement('article');let img=new Image();img.loading='lazy';img.crossOrigin='anonymous';img.src='https://aabhushan-sales-catalogue.jigar-rock13.chatgpt.site/photo/'+encodeURIComponent(i.code);img.alt=i.code;a.append(img);for(let [tag,t] of [['h3',i.code],['p',money(i.rate)+' / piece'],['p',i.pcs+' pcs · '+money(i.pcs*i.rate)+' / box']]){let x=document.createElement(tag);x.textContent=t;a.append(x)}showCharacteristics(a,i);if(i.hasDetails)productGallery(a,i,'https://aabhushan-sales-catalogue.jigar-rock13.chatgpt.site');const add=document.createElement('button');
add.textContent='Add 1 box';
add.onclick=()=>{changeBoxes(i.code,1);add.textContent='Add another box'};
const feedback=document.createElement('span');
feedback.className='photo-feedback';
feedback.setAttribute('role','status');
const btn=document.createElement('button');
btn.className='secondary';
btn.textContent='Share photo';
btn.onclick=()=>share(i,img,feedback);
a.append(add,btn,feedback);return a
}
function render(){
 const container=el('sections');
 container.replaceChildren();
 const query=el('search').value.trim().toLowerCase();
 const max=el('max').value;
 const selected=el('collection').value;
 const order=el('sort').value;
 const count=[query,max,selected,order!=='new'].filter(Boolean).length;
 el('active').textContent=count?' ('+count+' active)':'';
 const collections=new Map(["Ladies Rings","Gents Rings","Earrings","Pendants","Pendant Sets","Necklaces","Bangles","Chains","Bracelets","Other"].map(name=>[name,[]]));
 for(const item of items){
   if(selected && item.category!==selected)continue;
   if(max!=='' && item.rate>Number(max))continue;
   if(!([item.code,item.category,...Object.values(item.characteristics||{})].join(' ')).toLowerCase().includes(query))continue;
   collections.get(item.category)?.push(item);
 }
 for(const [name,designs] of collections){
   if(!designs.length)continue;
   designs.sort((a,b)=>{
     const price=order==='asc'?a.rate-b.rate:order==='desc'?b.rate-a.rate:0;
     return price || b.created-a.created || a.code.localeCompare(b.code);
   });
   const section=document.createElement('section');
   const heading=document.createElement('h2');
   heading.className='collection-heading';
   heading.textContent=name+' ('+designs.length+')';
   const grid=document.createElement('div');
   grid.className='grid';
   const limit=limits.get(name)||12;
   for(const item of designs.slice(0,limit))grid.append(designCard(item));
   section.append(heading,grid);
   if(designs.length>limit){
     const more=document.createElement('button');
     more.className='more';more.textContent='Show more '+name.toLowerCase();
     more.onclick=()=>{
       const next=designs.slice(limits.get(name)||12,(limits.get(name)||12)+32);
       for(const item of next)grid.append(designCard(item));
       const count=grid.childElementCount;
       limits.set(name,count);
       if(count>=designs.length)more.remove();
     };
     section.append(more);
   }
   container.append(section);
 }
 el('status').textContent=container.childElementCount?'':items.length?'No designs match your filters.':'New designs will appear here.';
}
async function share(i,img,feedback){try{await img.decode();let [c,g]=draw(img,1000,1250);g.fillStyle='#fffaf4';g.fillRect(0,0,1000,1250);g.fillStyle='#49182a';g.fillRect(0,0,1000,140);g.fillStyle='#fff4de';g.font='54px Georgia';g.fillText('Aabhushan Sales',42,75);g.font='22px sans-serif';g.fillText('PREMIUM MICRO JEWELLERY',44,111);let s=Math.min(916/img.naturalWidth,780/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;g.drawImage(img,(1000-w)/2,166+(780-h)/2,w,h);g.fillStyle='#49182a';g.font='50px Georgia';g.fillText(i.code,42,1020,916);g.font='30px sans-serif';g.fillText(i.category,44,1072);g.fillText(money(i.rate)+' per piece',44,1135);g.fillText(i.pcs+' pieces per box   ·   '+money(i.rate*i.pcs)+' per box',44,1190);let file=new File([await blob(c)],i.code+'.jpg',{type:'image/jpeg'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file]})}else{let u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;a.click();feedback.textContent='Photo downloaded. Attach it in WhatsApp.';setTimeout(()=>URL.revokeObjectURL(u),30000)}}catch(e){if(e.name!=='AbortError')feedback.textContent='Could not share this photo. Please try again.'}}
const storageKey='aabhushan-order-v1';
let basket=new Map();
try{
 const entries=JSON.parse(localStorage.getItem(storageKey)||'[]');
 basket=new Map(entries.filter(([code,n])=>typeof code==='string'&&Number.isInteger(n)&&n>0&&n<=9999));
}catch{}
function changeBoxes(code,delta){
 const n=Math.min(9999,(basket.get(code)||0)+delta);
 if(n>0)basket.set(code,n);else basket.delete(code);
 try{localStorage.setItem(storageKey,JSON.stringify([...basket]))}catch{}
 updateOrder();
}
function orderDetails(){
 const rows=items.filter(item=>basket.has(item.code)).map(item=>{
   const boxes=basket.get(item.code),pieces=boxes*item.pcs;
   return {item,boxes,pieces,paise:pieces*Math.round(item.rate*100)};
 });
 return {rows,boxes:rows.reduce((n,r)=>n+r.boxes,0),total:rows.reduce((n,r)=>n+r.paise,0)/100};
}
function updateOrder(){
 const {rows,boxes,total}=orderDetails(),lines=el('lines');
 lines.replaceChildren();
 el('basket').textContent='View order · '+boxes+(boxes===1?' box':' boxes');
 const message=['Namaste Aabhushan Sales, please confirm this wholesale order:'];
 for(const {item,boxes:qty,pieces,paise} of rows){
   const row=document.createElement('div'),info=document.createElement('div'),controls=document.createElement('div');
   row.className='order-row';controls.className='order-controls';
   const title=document.createElement('strong'),detail=document.createElement('p');
   title.textContent=item.code;detail.textContent=item.pcs+' pcs/box · '+pieces+' pcs · '+money(paise/100);
   info.append(title,detail);
   for(const [label,delta] of [['−',-1],['+',1]]){
     const button=document.createElement('button');button.textContent=label;
     button.setAttribute('aria-label',(delta<0?'Remove':'Add')+' one box of '+item.code);
     button.onclick=()=>changeBoxes(item.code,delta);
     if(delta===1){const count=document.createElement('output');count.textContent=qty;controls.append(count)}
     controls.append(button);
   }
   row.append(info,controls);lines.append(row);
   message.push(item.code+' | '+qty+' box(es) × '+item.pcs+' pcs × '+money(item.rate)+' = '+money(paise/100));
 }
 const summary=boxes+' box(es) · Total '+money(total);
 el('summary').textContent=boxes?summary:'Your order is empty. Add a box from any design.';
 const checkout=el('checkout');checkout.hidden=!boxes;
 message.push(summary);
 checkout.href='https://wa.me/917990541616?text='+encodeURIComponent(message.join('\n'));
}
el('basket').onclick=()=>{updateOrder();el('order').showModal()};
el('closeOrder').onclick=()=>el('order').close();
function resetFiltersView(){limits.clear();render()}
el('search').oninput=el('max').oninput=resetFiltersView;

load();
