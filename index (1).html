(function(){

function filtered(){var q=(document.getElementById('q').value||'').toLowerCase();return P.filter(function(p){if(cat!=='All'&&p.cat!==cat)return false;if(!q)return true;return (p.name||'').toLowerCase().indexOf(q)>=0||(p.code||'').toLowerCase().indexOf(q)>=0;});}
function fabCount(){var n=0;for(var k in cart)n+=cart[k];var f=document.getElementById('fab');f.style.display=n>0?'block':'none';document.getElementById('fc').textContent=n;}
function render(){
document.getElementById('chips').innerHTML=cats().map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';}).join('');

document.getElementById('grid').innerHTML=list.length?list.map(function(p){var out=(Number(p.stock)||0)<=0;return '<div class="card"><div class="th">'+(out?'<span class="b-out">Out</span>':'')+(p.img?'<img class="pimg" src="'+esc(p.img)+'">':'<div class="ph">❖</div>')+'</div><div class="bd">'+(p.code?'<div class="cd">'+esc(p.code)+'</div>':'')+'<div class="nm">'+esc(p.name)+'</div><div class="pr">'+money(p.price)+(Number(p.moq)>1?' <span style="font-size:10px;color:#6e6a5e">/ MOQ '+p.moq+'</span>':'')+'</div><button class="bt" data-add="'+p.id+'"'+(out?' disabled':'')+'>'+(out?'Out of stock':'Add to order')+'</button></div></div>';}).join(''):'<p style="color:#6e6a5e;text-align:center;padding:40px;grid-column:1/-1">No products found.</p>';

function close(){document.getElementById('scrim').classList.remove('on');document.getElementById('sheet').classList.remove('on');}
function openCart(){
