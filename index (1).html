<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Aabhushan Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#13392f;--green-2:#1d4f41;--gold:#c9a24b;--gold-soft:#e7cf94;--cream:#f7f2e7;--cream2:#efe7d4;
    --ink:#21251f;--muted:#6e6a5e;--line:#e2d8c0;--white:#fffdf7;--danger:#b4452f;--ok:#2f7d54;--warn:#b9842a;
    --shadow:0 10px 34px rgba(19,57,47,.16);--shadow-sm:0 2px 10px rgba(19,57,47,.08)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--cream)}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:16px}
  .hide{display:none!important}
  .top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--green),var(--green-2));color:var(--cream);padding:14px 16px;display:flex;align-items:center;gap:12px}
  .crest{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--gold-soft),var(--gold));display:grid;place-items:center;color:var(--green);font-family:'Fraunces';font-weight:700;font-size:20px;flex:none}
  .top h1{font-size:19px;color:var(--cream);line-height:1.05}.top .s{font-size:10px;color:var(--gold-soft);letter-spacing:.14em;text-transform:uppercase}
  .grow{flex:1}
  .ownerbtn{font-size:12px;color:var(--gold-soft);border:1px solid rgba(231,207,148,.4);padding:7px 12px;border-radius:999px}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 120px}
  .search{display:flex;gap:8px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .search input{border:none;outline:none;flex:1;background:none;font-size:15px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--white);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
  .chip.on{background:var(--green);color:var(--cream)}
  .bar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;color:var(--muted);font-size:13px}
  .addbtn{background:var(--gold);color:var(--green);font-weight:700;padding:8px 14px;border-radius:999px;font-size:13.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
  .th{aspect-ratio:1/1;background:linear-gradient(135deg,var(--cream2),#e6dcc4);position:relative}
  .th img{width:100%;height:100%;object-fit:cover}
  .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:30px;font-family:'Fraunces';opacity:.55}
  .b-out{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700}
  .b-low{position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700}
  .bd{padding:10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
  .cd{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase}
  .nm{font-weight:600;font-size:13.5px;line-height:1.2}.pr{font-family:'Fraunces';font-size:18px;font-weight:600;color:var(--green);margin-top:auto;padding-top:4px}
  .act{margin-top:8px;background:var(--green);color:var(--cream);font-weight:600;padding:9px;border-radius:10px;font-size:13.5px;width:100%}
  .act:disabled{background:var(--line);color:var(--muted)}
  .ownerctl{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .editl{font-size:12.5px;color:var(--gold);font-weight:700}
  .step{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--white)}
  .step button{width:30px;height:32px;font-size:17px;color:var(--green);font-weight:700}
  .step input{width:38px;text-align:center;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);height:32px}
  .fab{position:fixed;right:18px;bottom:20px;z-index:15;background:#1ebe5d;color:#fff;border-radius:999px;padding:14px 18px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
  .fab .c{background:#fff;color:#127a3c;border-radius:999px;padding:0 7px;margin-left:6px}
  .scrim{position:fixed;inset:0;background:rgba(19,57,47,.5);z-index:30;display:none}.scrim.on{display:block}
  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:0;width:100%;max-width:520px;z-index:31;background:var(--cream);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;transition:.25s}
  .sheet.on{transform:translateX(-50%)}
  .shead{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--cream)}
  .shead h2{font-size:19px;color:var(--green)}.shead .x{font-size:22px;color:var(--muted)}
  .sbody{padding:16px}
  .fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--white);outline:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .primary{width:100%;background:var(--green);color:var(--cream);font-weight:700;padding:14px;border-radius:12px;font-size:15px}
  .ghost{width:100%;background:var(--white);color:var(--green);border:1px solid var(--line);font-weight:600;padding:12px;border-radius:12px;margin-top:8px}
  .danger{width:100%;color:var(--danger);font-weight:600;padding:11px;margin-top:4px}
  .photo{aspect-ratio:1/1;max-height:200px;border:2px dashed var(--line);border-radius:14px;background:var(--white);display:grid;place-items:center;color:var(--muted);overflow:hidden;position:relative;margin-bottom:12px}
  .photo img{width:100%;height:100%;object-fit:cover}.photo .cam{font-size:32px;color:var(--gold)}
  .ci{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
  .ci .t{width:46px;height:46px;border-radius:9px;background:var(--cream2);overflow:hidden;flex:none}.ci .t img{width:100%;height:100%;object-fit:cover}
  .tot{font-family:'Fraunces';font-size:20px;color:var(--green);display:flex;justify-content:space-between;margin:8px 0}
  .wa{width:100%;background:#1ebe5d;color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:12px;margin-top:10px}
  .rm{color:var(--danger);font-size:12px;font-weight:600}
  .empty{text-align:center;padding:60px 16px;color:var(--muted)}.empty .ic{font-size:40px;color:var(--gold);opacity:.6}.empty h3{color:var(--green);margin:10px 0 5px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.55;background:var(--cream2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:10px}
  .setup{max-width:620px;margin:30px auto;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .setup h2{color:var(--green);font-size:22px;margin-bottom:8px}.setup code{background:var(--cream2);padding:2px 6px;border-radius:6px;font-size:13px}
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:90px;background:var(--green);color:var(--cream);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:90;opacity:0;transition:.25s;max-width:90%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .spin{text-align:center;padding:50px;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div class="crest" id="crest">A</div>
  <div style="min-width:0"><h1 id="bizName">Aabhushan Sales</h1><div class="s" id="bizSub">Imitation Jewellery</div></div>
  <div class="grow"></div>
  <button class="ownerbtn" id="ownerBtn">Owner</button>
</div>

<div class="wrap" id="wrap">
  <div class="spin" id="boot">Loading catalogue…</div>
</div>

<button class="fab hide" id="fab">🛒 Order <span class="c" id="fabC">0</span></button>

<div class="scrim" id="scrim"></div>

<!-- cart -->
<div class="sheet" id="cartSheet"><div class="shead"><h2>Your order</h2><button class="x" data-close>✕</button></div><div class="sbody" id="cartBody"></div></div>

<!-- login -->
<div class="sheet" id="loginSheet"><div class="shead"><h2>Owner login</h2><button class="x" data-close>✕</button></div>
  <div class="sbody">
    <div class="fld"><label>Email</label><input id="lg_email" type="email" autocomplete="username"/></div>
    <div class="fld"><label>Password</label><input id="lg_pass" type="password" autocomplete="current-password"/></div>
    <button class="primary" id="loginBtn">Log in</button>
    <div class="note">Only you can log in. Customers just browse and order — they never see this.</div>
  </div>
</div>

<!-- product form -->
<div class="sheet" id="formSheet"><div class="shead"><h2 id="formTitle">Add product</h2><button class="x" data-close>✕</button></div>
  <div class="sbody">
    <div class="photo" id="photoBox"><div class="pl"><div class="cam">📷</div><div style="font-size:13px;margin-top:6px">Tap to add a photo</div></div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0"/></div>
    <div class="fld"><label>Product name *</label><input id="f_name"/></div>
    <div class="two"><div class="fld"><label>Design code</label><input id="f_code"/></div><div class="fld"><label>Category</label><input id="f_cat" list="catList"/><datalist id="catList"></datalist></div></div>
    <div class="two"><div class="fld"><label>Wholesale rate (₹) *</label><input id="f_price" type="number" inputmode="numeric"/></div><div class="fld"><label>Min order qty</label><input id="f_moq" type="number" inputmode="numeric"/></div></div>
    <div class="fld"><label>Stock quantity</label><input id="f_stock" type="number" inputmode="numeric"/></div>
    <button class="primary" id="saveProd">Save product</button>
    <button class="danger hide" id="delProd">Delete this product</button>
  </div>
</div>

<!-- settings -->
<div class="sheet" id="setSheet"><div class="shead"><h2>Business details</h2><button class="x" data-close>✕</button></div>
  <div class="sbody">
    <div class="fld"><label>Business name</label><input id="s_name"/></div>
    <div class="fld"><label>Tagline / location</label><input id="s_sub"/></div>
    <div class="fld"><label>WhatsApp number (e.g. 919876543210)</label><input id="s_wa" inputmode="numeric"/></div>
    <div class="two"><div class="fld"><label>Currency</label><input id="s_cur"/></div><div class="fld"><label>Low-stock below</label><input id="s_low" type="number" inputmode="numeric"/></div></div>
    <button class="primary" id="saveSet">Save</button>
    <button class="ghost" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   1) PASTE YOUR SUPABASE DETAILS HERE (both are PUBLIC keys — safe)
   ============================================================ */
const SUPABASE_URL = "https://hkwmeeeajkuxycgovevc.supabase.co";       // e.g. https://abcd1234.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_oA7vBAjke-TU7ipfUyW8oQ_7vIHshPf";
const PHOTO_BUCKET = "product-photos";
/* ============================================================ */

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb=null, products=[], settings={name:'Aabhushan Sales',sub:'',whatsapp:'',currency:'₹',low_stock:10};
let cart={}, owner=false, activeCat='All', editingId=null, pendingFile=null, pendingPreview='';
const cur=()=>settings.currency||'₹';
const money=n=>cur()+Number(n||0).toLocaleString('en-IN');
let tT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200);};

function configured(){return SUPABASE_URL.indexOf('PASTE_')<0 && SUPABASE_ANON_KEY.indexOf('PASTE_')<0 && SUPABASE_URL.indexOf('http')===0;}

async function init(){
  if(!configured()){ showSetup(); return; }
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(e){ $('#boot').textContent='Could not start. Check your Supabase details.'; return; }
  await loadAll();
  const { data:{ session } } = await sb.auth.getSession();
  owner = !!session;
  bind();
  render();
  if(owner) ownerOn();
}

async function loadAll(){
  try{
    const ps = await sb.from('products').select('*').order('created_at',{ascending:false});
    if(ps.error) throw ps.error;
    products = (ps.data||[]).map(r=>({id:r.id,name:r.name,code:r.code||'',cat:r.category||'',price:r.price||0,moq:r.moq||1,stock:r.stock||0,img:r.image_url||''}));
    const ss = await sb.from('settings').select('*').eq('id',1).maybeSingle();
    if(ss.data) settings=Object.assign(settings,{name:ss.data.name,sub:ss.data.sub,whatsapp:ss.data.whatsapp,currency:ss.data.currency||'₹',low_stock:ss.data.low_stock||10});
  }catch(e){ $('#boot').innerHTML='Could not load data.<br><span style="font-size:12px">'+esc(e.message||'')+'</span>'; }
  brand();
}
function brand(){ $('#bizName').textContent=settings.name||'Catalogue'; $('#bizSub').textContent=settings.sub||''; $('#crest').textContent=(settings.name||'A').charAt(0).toUpperCase(); document.title=settings.name||'Catalogue'; }

function cats(){var s={},a=['All'];products.forEach(p=>{if(p.cat)s[p.cat]=1;});Object.keys(s).sort().forEach(c=>a.push(c));return a;}
function filtered(){const q=($('#q')?$('#q').value:'').trim().toLowerCase();return products.filter(p=>{if(activeCat!=='All'&&p.cat!==activeCat)return false;if(!q)return true;return (p.name||'').toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q);});}
function badge(p){const s=+p.stock||0;if(s<=0)return '<span class="b-out">Out</span>';if(s<=(+settings.low_stock||0))return '<span class="b-low">Low '+s+'</span>';return '';}

function render(){
  const w=$('#wrap');
  w.innerHTML=`<div class="search"><span>🔎</span><input id="q" placeholder="Search name or design code…"></div><div class="chips" id="chips"></div>
    <div class="bar"><span id="count"></span>${owner?'<button class="addbtn" id="addP">＋ Add product</button>':''}</div>
    <div class="grid" id="grid"></div>`;
  $('#q').addEventListener('input',render2);
  if(owner) $('#addP').onclick=()=>openForm(null);
  render2();
}
function render2(){
  if(!$('#chips')) return render();
  $('#chips').innerHTML=cats().map(c=>`<button class="chip${c===activeCat?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $$('#chips .chip').forEach(b=>b.onclick=()=>{activeCat=b.getAttribute('data-c');render2();});
  $('#catList')&&($('#catList').innerHTML=cats().filter(c=>c!=='All').map(c=>`<option value="${esc(c)}">`).join(''));
  const list=filtered();
  $('#count').textContent=`${list.length} of ${products.length} products`;
  const g=$('#grid');
  if(!list.length){g.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="ic">❖</div><h3>${products.length?'Nothing found':'No products yet'}</h3><p>${owner&&!products.length?'Tap “Add product” to begin.':''}</p></div>`;return;}
  g.innerHTML='';
  list.forEach(p=>{
    const out=(+p.stock||0)<=0;
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`<div class="th">${badge(p)}${p.img?`<img src="${esc(p.img)}">`:'<div class="ph">❖</div>'}</div>
      <div class="bd">${p.code?`<div class="cd">${esc(p.code)}</div>`:''}<div class="nm">${esc(p.name)}</div>
      <div class="pr">${money(p.price)}${(+p.moq>1)?` <span style="font-size:10px;color:var(--muted)">/ MOQ ${p.moq}</span>`:''}</div></div>`;
    const bd=el.querySelector('.bd');
    if(owner){
      const c=document.createElement('div');c.className='ownerctl';
      c.innerHTML=`<div class="step"><button data-d>−</button><input type="number" value="${+p.stock||0}"><button data-i>+</button></div><button class="editl">Edit ✎</button>`;
      const inp=c.querySelector('input');
      c.querySelector('[data-d]').onclick=()=>{inp.value=Math.max(0,(+inp.value||0)-1);setStock(p,inp.value);};
      c.querySelector('[data-i]').onclick=()=>{inp.value=(+inp.value||0)+1;setStock(p,inp.value);};
      inp.onchange=()=>setStock(p,inp.value);
      c.querySelector('.editl').onclick=()=>openForm(p.id);
      bd.appendChild(c);
    }else{
      const b=document.createElement('button');b.className='act';b.disabled=out;b.textContent=out?'Out of stock':'Add to order';
      b.onclick=()=>{const step=Math.max(1,+p.moq||1);cart[p.id]=(cart[p.id]||0)+step;fab();toast('Added '+p.name);};
      bd.appendChild(b);
    }
    g.appendChild(el);
  });
}

function fab(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('#fab').classList.toggle('hide',n<=0||owner);$('#fabC').textContent=n;}
function lines(){return Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id===id);return p?{p,qty:q,line:(+p.price||0)*q}:null;}).filter(Boolean);}
function openCart(){
  const L=lines(),b=$('#cartBody');
  if(!L.length){b.innerHTML='<div class="empty"><p>Your order is empty.</p></div>';return open('cartSheet');}
  b.innerHTML=L.map(({p,qty})=>{const moq=Math.max(1,+p.moq||1);return `<div class="ci" data-id="${p.id}"><div class="t">${p.img?`<img src="${esc(p.img)}">`:''}</div>
    <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">${esc(p.name)}</div><div style="font-size:11px;color:var(--muted)">${money(p.price)} each</div>
    <div class="step" style="margin-top:5px"><button data-d>−</button><input type="number" value="${qty}"><button data-i>+</button></div></div>
    <div style="font-weight:700">${money((+p.price||0)*qty)}</div></div>`;}).join('')+
    `<div class="fld" style="margin-top:14px"><label>Your shop / name</label><input id="cn" placeholder="Shree Ji Collection, Surat"></div>
     <div class="tot"><span>Total</span><span>${money(L.reduce((s,l)=>s+l.line,0))}</span></div>
     <button class="wa" id="send">📲 Send order on WhatsApp</button>
     ${!settings.whatsapp?'<div class="note">Seller has not set a WhatsApp number yet.</div>':''}`;
  b.querySelectorAll('.ci').forEach(row=>{const id=row.dataset.id,p=products.find(x=>x.id===id),moq=Math.max(1,+p.moq||1),inp=row.querySelector('input');
    row.querySelector('[data-d]').onclick=()=>{cart[id]=Math.max(moq,(+inp.value||moq)-1);openCart();fab();};
    row.querySelector('[data-i]').onclick=()=>{cart[id]=(+inp.value||moq)+1;openCart();fab();};
    inp.onchange=()=>{cart[id]=Math.max(moq,+inp.value||moq);openCart();fab();};});
  $('#send').onclick=()=>{const L2=lines(),total=L2.reduce((s,l)=>s+l.line,0),pcs=L2.reduce((s,l)=>s+l.qty,0);
    const nm=($('#cn').value||'').trim();const NL=String.fromCharCode(10);
    let m='🛍️ *New Order — '+(settings.name||'Catalogue')+'*'+NL+'—————————————'+NL;
    L2.forEach((l,i)=>{m+=(i+1)+'. '+l.p.name+(l.p.code?' ('+l.p.code+')':'')+NL+'    '+l.qty+' x '+money(l.p.price)+' = '+money(l.line)+NL;});
    m+='—————————————'+NL+'*Total: '+money(total)+'*  ('+pcs+' pcs)';if(nm)m+=NL+NL+'From: '+nm;
    globalThis.open('https://wa.me/'+(settings.whatsapp||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(m),'_blank');};
  open('cartSheet');
}

/* ---------- owner ---------- */
async function login(){
  const email=$('#lg_email').value.trim(),pass=$('#lg_pass').value;
  if(!email||!pass)return toast('Enter email and password');
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)return toast(error.message);
  owner=true;closeAll();ownerOn();await loadAll();render();toast('Logged in');
}
function ownerOn(){owner=true;$('#ownerBtn').textContent='Manage';$('#ownerBtn').onclick=()=>openSettings();$('#fab').classList.add('hide');render();}
async function logout(){await sb.auth.signOut();owner=false;$('#ownerBtn').textContent='Owner';$('#ownerBtn').onclick=()=>open('loginSheet');closeAll();render();toast('Logged out');}

async function setStock(p,v){const n=Math.max(0,Math.floor(+v||0));p.stock=n;const {error}=await sb.from('products').update({stock:n}).eq('id',p.id);if(error)toast(error.message);}

function openForm(id){
  editingId=id;pendingFile=null;pendingPreview='';
  const p=id?products.find(x=>x.id===id):null;
  $('#formTitle').textContent=p?'Edit product':'Add product';
  $('#f_name').value=p?p.name:'';$('#f_code').value=p?p.code:'';$('#f_cat').value=p?p.cat:'';
  $('#f_price').value=p?p.price:'';$('#f_moq').value=p?p.moq:'';$('#f_stock').value=p?p.stock:'';
  setPhoto(p?p.img:'');$('#delProd').classList.toggle('hide',!p);
  open('formSheet');
}
function setPhoto(src){const box=$('#photoBox');box.querySelectorAll('img,.x').forEach(e=>e.remove());const pl=box.querySelector('.pl');
  if(src){pl.style.display='none';const im=document.createElement('img');im.src=src;box.insertBefore(im,box.firstChild);}else pl.style.display='block';}
$('#photoInput')&&0;
async function saveProduct(){
  const name=$('#f_name').value.trim(),price=$('#f_price').value;
  if(!name)return toast('Enter a name');if(price===''||isNaN(+price))return toast('Enter a valid rate');
  let imgUrl = editingId ? (products.find(x=>x.id===editingId)||{}).img||'' : '';
  if(pendingFile){
    toast('Uploading photo…');
    const ext=(pendingFile.name.split('.').pop()||'jpg').toLowerCase();
    const path='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+ext;
    const up=await sb.storage.from(PHOTO_BUCKET).upload(path,pendingFile,{upsert:true,contentType:pendingFile.type});
    if(up.error)return toast('Photo upload failed: '+up.error.message);
    imgUrl=sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
  }
  const row={name,code:$('#f_code').value.trim(),category:$('#f_cat').value.trim(),price:Math.max(0,+price),
    moq:Math.max(1,+$('#f_moq').value||1),stock:Math.max(0,Math.floor(+$('#f_stock').value||0)),image_url:imgUrl};
  let res;
  if(editingId) res=await sb.from('products').update(row).eq('id',editingId);
  else res=await sb.from('products').insert(row);
  if(res.error)return toast(res.error.message);
  closeAll();await loadAll();render();toast(editingId?'Updated ✓':'Added ✓');
}
async function deleteProduct(){if(!editingId)return;if(!confirm('Remove this product?'))return;
  const {error}=await sb.from('products').delete().eq('id',editingId);if(error)return toast(error.message);
  closeAll();await loadAll();render();toast('Removed');}

function openSettings(){$('#s_name').value=settings.name||'';$('#s_sub').value=settings.sub||'';$('#s_wa').value=settings.whatsapp||'';$('#s_cur').value=settings.currency||'₹';$('#s_low').value=settings.low_stock||10;open('setSheet');}
async function saveSettings(){
  const row={id:1,name:$('#s_name').value.trim()||'My Store',sub:$('#s_sub').value.trim(),whatsapp:$('#s_wa').value.replace(/[^0-9]/g,''),currency:$('#s_cur').value.trim()||'₹',low_stock:Math.max(0,+$('#s_low').value||0)};
  const {error}=await sb.from('settings').upsert(row);if(error)return toast(error.message);
  Object.assign(settings,{name:row.name,sub:row.sub,whatsapp:row.whatsapp,currency:row.currency,low_stock:row.low_stock});
  brand();closeAll();render();toast('Saved');
}

/* ---------- sheets ---------- */
function open(id){$('#scrim').classList.add('on');$('#'+id).classList.add('on');}
function closeAll(){$('#scrim').classList.remove('on');$$('.sheet').forEach(s=>s.classList.remove('on'));}

function bind(){
  $('#scrim').onclick=closeAll;$$('[data-close]').forEach(b=>b.onclick=closeAll);
  $('#fab').onclick=openCart;
  $('#ownerBtn').onclick=()=> owner?openSettings():open('loginSheet');
  $('#loginBtn').onclick=login;
  $('#saveProd').onclick=saveProduct;$('#delProd').onclick=deleteProduct;
  $('#saveSet').onclick=saveSettings;$('#logoutBtn').onclick=logout;
  $('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;pendingFile=f;const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f);};
}
